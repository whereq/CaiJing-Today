# =============================================================================
# CaiJing Today — Development Docker Compose
# =============================================================================
# Usage (from this repo root):
#   cp docker/.env.example docker/.env
#   docker compose -f docker/docker-compose.dev.yml up -d
#   docker compose -f docker/docker-compose.dev.yml down
#
# Same services as the production stack, but with hot reload:
#   - the API runs uvicorn --reload with the source bind-mounted
#   - the frontend runs the Vite dev server with the source bind-mounted
#   - PostgreSQL is identical, so the schema contract and demo data load the
#     same way
#
# Host ports: 8001 (API) / 5174 (Vite dev server).
#
# The init scripts only run on FIRST boot — to re-apply the schema:
#   docker compose -f docker/docker-compose.dev.yml down -v
# =============================================================================

name: caijing-dev

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — the database the API reads.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: caijing-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caijing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caijing}
      POSTGRES_DB: ${POSTGRES_DB:-caijing}
      # Read by docker/db/init/10-load-demo.sh.
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-true}
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
      - ../docs/SCHEMA.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../docs/samples/demo_data.sql:/opt/caijing/demo_data.sql:ro
      - ./db/init/10-load-demo.sh:/docker-entrypoint-initdb.d/10-load-demo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caijing} -d ${POSTGRES_DB:-caijing}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No host port for the database, on purpose — see the note in
    # docker-compose.yml. The API reaches it over the compose network.
    #   docker compose -f docker/docker-compose.dev.yml exec postgres \
    #     psql -U caijing -d caijing

  # ---------------------------------------------------------------------------
  # API Layer (read-only against the database)
  # ---------------------------------------------------------------------------
  caijing-api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile.dev
    image: caijing-api-dev
    container_name: caijing-api-dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-caijing}:${POSTGRES_PASSWORD_ENCODED:-caijing}@postgres:5432/${POSTGRES_DB:-caijing}
      CORS_ORIGINS: '["http://localhost:5174", "http://localhost:5173", "http://localhost:3000"]'
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.example.com}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-caijing-today}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-caijing-today-spa}
      SEED_FALLBACK_ENABLED: ${SEED_FALLBACK_ENABLED:-false}
    volumes:
      - ../backend/caijing:/app/caijing:cached
      - ../backend/api:/app/api:cached
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend Layer (Vite dev server, hot reload)
  # ---------------------------------------------------------------------------
  caijing-frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
    image: caijing-frontend-dev
    container_name: caijing-frontend-dev
    environment:
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://auth.example.com}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-caijing-today}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-caijing-today-spa}
      # Where the dev server proxies /api — inside the compose network this is
      # the api service, not localhost.
      API_PROXY_TARGET: http://caijing-api:8000
    volumes:
      - ../frontend/src:/app/src:cached
      - ../frontend/public:/app/public:cached
      - ../frontend/index.html:/app/index.html:cached
      - ../frontend/vite.config.ts:/app/vite.config.ts:cached
      - ../frontend/tsconfig.json:/app/tsconfig.json:cached
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json:cached
      - ../frontend/eslint.config.js:/app/eslint.config.js:cached
    ports:
      - "5174:5173"
    depends_on:
      - caijing-api

volumes:
  postgres-data-dev:
